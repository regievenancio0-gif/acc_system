<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACC Consultation System</title>
<style>
:root{--p:#4f46e5;--p2:#06b6d4;--bg:#0f172a;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;color:#1e293b;min-height:100vh;
 background:linear-gradient(135deg,#4f46e5,#06b6d4,#8b5cf6);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(15,23,42,.85);color:#fff;backdrop-filter:blur(6px)}
nav b{font-size:1.2rem;letter-spacing:.5px}
.wrap{max-width:1050px;margin:28px auto;padding:0 16px}
.card{background:var(--card);border-radius:16px;padding:24px;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:rise .6s ease both;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.28)}
input,select,textarea{width:100%;padding:11px;margin:6px 0 14px;border:2px solid #e2e8f0;border-radius:10px;font:inherit;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
button,.btn{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border:0;padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:600;transition:transform .2s,filter .2s}
button:hover{transform:scale(1.06);filter:brightness(1.1)}
button.danger{background:#ef4444}button.ghost{background:#64748b}
table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0}
tbody tr{transition:background .2s}tbody tr:hover{background:#eef2ff}
.badge{padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:700;color:#fff;background:#64748b}
.pending{background:#f59e0b}.approved{background:#10b981}.completed{background:#4f46e5}.declined,.cancelled{background:#ef4444}
.flash{padding:12px 16px;border-radius:10px;margin-bottom:14px;animation:rise .4s}
.ok{background:#d1fae5;color:#065f46}.error{background:#fee2e2;color:#991b1b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{text-align:center;font-size:2rem;font-weight:800;color:var(--p)}.stat small{display:block;font-size:.8rem;color:#64748b}
form.inline{display:inline}
</style></head><body>
{% if user %}<nav><b>🩺 ACC Consultation</b><span>{{ user.name }} · <span class="badge">{{ user.role.replace('_',' ') }}</span>
<form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="ghost">Logout</button></form></span></nav>{% endif %}
<div class="wrap">
{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="flash {{cat}}">{{ msg }}</div>{% endfor %}
{% block body %}{% endblock %}
</div></body></html>
